  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #050505;
      color: #f3f4f6;
      margin: 0;
      overflow-x: hidden;
      user-select: none;
    }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
    .glass-card {
      background: rgba(10, 10, 14, 0.25);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.30000000000000004);
    }
    .glass-widget {
      background: rgba(20, 20, 25, 0.1875);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.13124999999999998);
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-pill:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .text-glow { text-shadow: 0 0 12px rgba(255, 255, 255, 0.4); }
    .avatar-glow { box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 255, 255, 0.12); }
    @keyframes snakeSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-snake-spin {
      animation: snakeSpin 3.5s linear infinite;
    }
    .snake-glow-streak {
      background: conic-gradient(
        from 0deg at 50% 50%,
        transparent 0deg,
        transparent 220deg,
        rgba(255, 255, 255, 0.05) 250deg,
        rgba(255, 255, 255, 0.2) 290deg,
        rgba(255, 255, 255, 0.6) 335deg,
        #ffffff 360deg
      );
    }
    .neon-white-glow {
      /* Clean crisp snake */
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .animate-cursor-blink {
      animation: blinkCursor 0.9s infinite;
    }
    @keyframes eqBounce1 {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }
    @keyframes eqBounce2 {
      0%, 100% { height: 12px; }
      50% { height: 4px; }
    }
    @keyframes eqBounce3 {
      0%, 100% { height: 6px; }
      50% { height: 13px; }
    }
    @keyframes eqBounce4 {
      0%, 100% { height: 10px; }
      50% { height: 3px; }
    }
    .eq-bar-1.active { animation: eqBounce1 0.75s ease-in-out infinite; }
    .eq-bar-2.active { animation: eqBounce2 0.6s ease-in-out infinite 0.1s; }
    .eq-bar-3.active { animation: eqBounce3 0.85s ease-in-out infinite 0.2s; }
    .eq-bar-4.active { animation: eqBounce4 0.7s ease-in-out infinite 0.15s; }

    /* Animated Flame Avatar Frame */
    @keyframes flamePulsate {
      0%, 100% {
        transform: scale(1) rotate(0deg);
        filter: drop-shadow(0 0 10px rgba(255, 100, 0, 0.8)) drop-shadow(0 -4px 18px rgba(255, 60, 0, 0.6));
        opacity: 0.95;
      }
      25% {
        transform: scale(1.03, 1.06) rotate(-1deg) translateY(-1.5px);
        filter: drop-shadow(0 0 14px rgba(255, 140, 0, 0.95)) drop-shadow(0 -6px 24px rgba(255, 40, 0, 0.75));
        opacity: 1;
      }
      50% {
        transform: scale(0.98, 1.02) rotate(1.5deg) translateY(-0.5px);
        filter: drop-shadow(0 0 9px rgba(255, 90, 0, 0.8)) drop-shadow(0 -3px 16px rgba(255, 30, 0, 0.55));
        opacity: 0.92;
      }
      75% {
        transform: scale(1.04, 1.08) rotate(-1deg) translateY(-2px);
        filter: drop-shadow(0 0 16px rgba(255, 170, 20, 1)) drop-shadow(0 -8px 28px rgba(255, 60, 0, 0.85));
        opacity: 1;
      }
    }

    @keyframes flameTongues1 {
      0%, 100% { transform: scale(1) rotate(0deg); }
      33% { transform: scale(1.04, 1.07) rotate(2.5deg) translateY(-2px); }
      66% { transform: scale(0.97, 1.03) rotate(-2deg) translateY(-0.5px); }
    }

    @keyframes flameTongues2 {
      0%, 100% { transform: scale(1.02, 1.01) rotate(0deg); }
      33% { transform: scale(0.96, 1.05) rotate(-3.5deg) translateY(-1.5px); }
      66% { transform: scale(1.05, 1.08) rotate(2deg) translateY(-2.5px); }
    }

    @keyframes flameTongues3 {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.06, 1.04) rotate(1.8deg) translateY(-1.2px); }
    }

    @keyframes emberRise1 {
      0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
      25% { opacity: 1; transform: translate(4px, -16px) scale(1); }
      70% { opacity: 0.8; transform: translate(-3px, -38px) scale(0.7); }
      100% { transform: translate(6px, -58px) scale(0.15); opacity: 0; }
    }

    @keyframes emberRise2 {
      0% { transform: translate(0, 0) scale(0.7); opacity: 0; }
      30% { opacity: 1; transform: translate(-5px, -20px) scale(1.1); }
      75% { opacity: 0.7; transform: translate(4px, -44px) scale(0.6); }
      100% { transform: translate(-4px, -66px) scale(0.1); opacity: 0; }
    }

    @keyframes emberRise3 {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      25% { opacity: 1; transform: translate(6px, -15px) scale(1); }
      70% { opacity: 0.9; transform: translate(-4px, -35px) scale(0.65); }
      100% { transform: translate(3px, -55px) scale(0.1); opacity: 0; }
    }

    .animate-flame-pulse {
      animation: flamePulsate 1.8s infinite ease-in-out;
      transform-origin: center center;
    }

    .animate-flame-1 {
      animation: flameTongues1 1.2s infinite ease-in-out;
      transform-origin: center center;
    }

    .animate-flame-2 {
      animation: flameTongues2 1.6s infinite ease-in-out;
      transform-origin: center center;
    }

    .animate-flame-3 {
      animation: flameTongues3 0.95s infinite ease-in-out;
      transform-origin: center center;
    }

    .animate-ember-1 {
      animation: emberRise1 2.2s infinite cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .animate-ember-2 {
      animation: emberRise2 2.7s infinite cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.8s;
    }

    .animate-ember-3 {
      animation: emberRise3 2.1s infinite cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.4s;
    }
  </style>

                <span class="eq-bar eq-bar-2 w-[2.5px] h-2 bg-zinc-500 rounded-full"></span>
                <span class="eq-bar eq-bar-3 w-[2.5px] h-1.5 bg-zinc-500 rounded-full"></span>
                <span class="eq-bar eq-bar-4 w-[2.5px] h-1 bg-zinc-500 rounded-full"></span>
              </div>
              <span class="text-sm font-semibold tracking-wide text-white/95 truncate">do u love me?</span>
              <span class="text-xs text-zinc-400 truncate hidden sm:inline">by faraonov</span>
            </div>
            <button onclick="toggleAudio()" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 border border-white/15 flex items-center justify-center text-white active:scale-95 transition-all">
              <svg id="play-icon" class="w-3.5 h-3.5 fill-white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </div>
          <div class="flex items-center gap-2 text-[11px] text-zinc-400 font-mono-code">
            <span id="cur-time">00:00</span>
            <input id="audio-progress" type="range" min="0" max="100" value="0" oninput="seekAudio(this.value)" class="flex-1 h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-white hover:bg-white/30" />
            <span id="dur-time">00:00</span>
          </div>
        </div>
      </div>

    <div class="text-[11px] text-zinc-500/70 font-mono-code select-none">
      <span>faraonov.lol</span>
    </div>
  </div>

  
  <div id="yt-player" class="hidden"></div><script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // Typewriter bio effect
    (function initTypewriter() {
      const el = document.getElementById('typewriter-text');
      if (!el) return;
      const fullText = "the path to the dream is not so difficult, just try.\nsoftware engineering.";
      let idx = 0;
      let isDeleting = false;
      el.textContent = "";

      function tick() {
        if (!isDeleting) {
          idx++;
          el.textContent = fullText.slice(0, idx);
          if (idx >= fullText.length) {
            setTimeout(() => { isDeleting = true; tick(); }, 4000);
            return;
          }
          setTimeout(tick, 45);
        } else {
          idx--;
          el.textContent = fullText.slice(0, idx);
          if (idx <= 0) {
            isDeleting = false;
            setTimeout(tick, 800);
            return;
          }
          setTimeout(tick, 20);
        }
      }
      setTimeout(tick, 600);
    })();

    const isYt = true;
    let ytPlayer = null;
    let audio = document.getElementById('bg-audio');
    const playIcon = document.getElementById('play-icon');
    const vinyl = document.getElementById('vinyl-disk');
    const curTimeSpan = document.getElementById('cur-time');
    const durTimeSpan = document.getElementById('dur-time');
    const progress = document.getElementById('audio-progress');
    const eqBars = document.querySelectorAll('.eq-bar');
    let isPlaying = false;

    // Discord Lanyard Integration
    const isLanyard = true;
    const lanyardUserId = '1406731212919144469';

    function updateDiscordUI(data) {
      if (!data) return;
      const user = data.discord_user;
      const status = data.discord_status || 'offline';
      
      const avatarEl = document.getElementById('discord-avatar');
      const nameEl = document.getElementById('discord-name');
      const statusDot = document.getElementById('discord-status-dot');
      const actTitleEl = document.getElementById('discord-activity-title');
      const actDetailsEl = document.getElementById('discord-activity-details');
      const badgeEl = document.getElementById('discord-badge');

      if (avatarEl && user) {
        let avatarUrl = '';
        if (user.avatar) {
          const isAnim = user.avatar.startsWith('a_');
          avatarUrl = 'https://cdn.discordapp.com/avatars/' + user.id + '/' + user.avatar + '.' + (isAnim ? 'gif' : 'webp') + '?size=160';
        } else {
          const idx = (parseInt(user.discriminator || '0', 10) || 0) % 5;
          avatarUrl = 'https://cdn.discordapp.com/embed/avatars/' + idx + '.png';
        }
        avatarEl.src = avatarUrl;
      }

      if (nameEl && user) {
        nameEl.textContent = user.global_name || user.username;
      }

      if (statusDot) {
        if (status === 'online') {
          statusDot.className = 'absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full bg-emerald-500 ring-2 ring-zinc-900 shadow-sm';
          statusDot.innerHTML = '';
        } else if (status === 'idle') {
          statusDot.className = 'absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full bg-amber-400 ring-2 ring-zinc-900 flex items-center justify-center shadow-sm';
          statusDot.innerHTML = '<svg class="w-2.5 h-2.5 text-zinc-900 fill-zinc-900" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>';
        } else if (status === 'dnd') {
          statusDot.className = 'absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full bg-rose-500 ring-2 ring-zinc-900 flex items-center justify-center shadow-sm';
          statusDot.innerHTML = '<svg class="w-2.5 h-2.5 text-white" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75-4.365 9.75-9.75 9.75S17.385 2.25 12 2.25zM6.75 12a.75.75 0 01.75-.75h9a.75.75 0 010 1.5h-9a.75.75 0 01-.75-.75z" clip-rule="evenodd"/></svg>';
        } else {
          statusDot.className = 'absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full bg-zinc-500 ring-2 ring-zinc-900 flex items-center justify-center shadow-sm';
          statusDot.innerHTML = '<svg class="w-2 h-2 text-zinc-900 fill-zinc-900" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg>';
        }
      }

      let actTitle = '';
      let actDetails = '';
      let actBadge = '';

      if (data.listening_to_spotify && data.spotify) {
        actTitle = 'Listening to ' + data.spotify.song;
        actDetails = 'by ' + data.spotify.artist;
        actBadge = 'SPOTIFY';
      } else if (data.activities && data.activities.length > 0) {
        const game = data.activities.find(a => a.type !== 4);
        const custom = data.activities.find(a => a.type === 4);
        if (game) {
          actTitle = 'Playing ' + game.name;
          actDetails = game.details || game.state || '';
          actBadge = (game.name || 'GAME').toUpperCase().substring(0, 12);
        } else if (custom) {
          actTitle = custom.state || custom.name || 'Custom Status';
          actDetails = custom.details || '';
          actBadge = 'STATUS';
        } else {
          actTitle = status === 'online' ? 'Online on Discord' : status === 'idle' ? 'Away / Idle' : status === 'dnd' ? 'Do Not Disturb' : 'Offline';
          actDetails = '';
          actBadge = '';
        }
      } else {
        if (status === 'online') {
          actTitle = 'Online on Discord';
          actDetails = 'No current activity';
        } else if (status === 'idle') {
          actTitle = 'Away / Idle';
        } else if (status === 'dnd') {
          actTitle = 'Do Not Disturb';
        } else {
          actTitle = 'Offline';
          actDetails = 'Currently away';
        }
        actBadge = '';
      }

      if (actTitleEl) actTitleEl.textContent = actTitle;
      if (actDetailsEl) actDetailsEl.textContent = actDetails;
      if (badgeEl) {
        if (actBadge) {
          badgeEl.style.display = 'flex';
          badgeEl.querySelector('span').textContent = actBadge;
        } else {
          badgeEl.style.display = 'none';
        }
      }
    }

    if (isLanyard && lanyardUserId && /^\d{17,20}$/.test(lanyardUserId)) {
      fetch('https://api.lanyard.rest/v1/users/' + lanyardUserId)
        .then(r => r.json())
        .then(j => {
          if (j && j.success && j.data) updateDiscordUI(j.data);
        })
        .catch(e => console.log(e));

      try {
        const ws = new WebSocket('wss://api.lanyard.rest/socket');
        let hb = null;

        ws.onopen = function() {
          ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: lanyardUserId } }));
        };
        ws.onmessage = function(ev) {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.op === 1 && msg.d && msg.d.heartbeat_interval) {
              clearInterval(hb);
              hb = setInterval(function() {
                if (ws.readyState === WebSocket.OPEN) {
                  ws.send(JSON.stringify({ op: 3 }));
                }
              }, msg.d.heartbeat_interval);
            }
            if (msg.op === 0 && (msg.t === 'INIT_STATE' || msg.t === 'PRESENCE_UPDATE')) {
              updateDiscordUI(msg.d);
            }
          } catch(e) {}
        };
        ws.onclose = function() {
          clearInterval(hb);
        };
      } catch(e) {}
    }


    window.onYouTubeIframeAPIReady = function() {
      if (isYt) {
        ytPlayer = new YT.Player('yt-player', {
          height: '1', width: '1',
          videoId: 'wB0PXXlWcrc',
          playerVars: { autoplay: 0, controls: 0, loop: 1, playlist: 'wB0PXXlWcrc' },
          events: {
            onStateChange: (e) => {
              setPlayState(e.data === 1);
            }
          }
        });
      }
    };

    let userPaused = false;

    function enterSite() {
      const overlay = document.getElementById('click-overlay');
      if (overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => overlay.style.display = 'none', 700);
      }
      if (!userPaused) {
        if (isYt && ytPlayer) {
          try { ytPlayer.playVideo(); } catch(e){}
        } else if (audio) {
          audio.play().then(() => setPlayState(true)).catch(e => console.log(e));
        }
      }
    }

    // Global tap/click anywhere on the screen triggers audio immediately
    function onScreenInteraction(e) {
      if (userPaused) return;
      var t = e.target;
      if (t && t.closest && t.closest('[data-audio-control="true"]')) return;
      enterSite();
    }
    window.addEventListener('pointerdown', onScreenInteraction);
    window.addEventListener('touchstart', onScreenInteraction);
    window.addEventListener('click', onScreenInteraction);

    function toggleAudio() {
      if (isYt && ytPlayer) {
        if (isPlaying) {
          userPaused = true;
          ytPlayer.pauseVideo();
        } else {
          userPaused = false;
          ytPlayer.playVideo();
        }
      } else if (audio) {
        if (isPlaying) {
          userPaused = true;
          audio.pause();
          setPlayState(false);
        } else {
          userPaused = false;
          audio.play().then(() => setPlayState(true)).catch(e => console.log(e));
        }
      }
    }

    function setPlayState(p) {
      isPlaying = p;
      if (vinyl) {
        p ? vinyl.classList.add('animate-spin-slow') : vinyl.classList.remove('animate-spin-slow');
      }
      if (playIcon) {
        playIcon.innerHTML = p ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
      }
      if (eqBars) {
        eqBars.forEach(function(bar) {
          if (p) {
            bar.classList.add('active');
            bar.classList.remove('bg-zinc-500');
            bar.classList.add('bg-white');
          } else {
            bar.classList.remove('active');
            bar.classList.add('bg-zinc-500');
            bar.classList.remove('bg-white');
          }
        });
      }
    }

    if (audio) {
      audio.addEventListener('timeupdate', () => {
        if (progress) progress.value = Math.floor(audio.currentTime);
        if (curTimeSpan) curTimeSpan.textContent = formatTime(Math.floor(audio.currentTime));
      });
      audio.addEventListener('loadedmetadata', () => {
        if (audio.duration && !isNaN(audio.duration)) {
          if (progress) progress.max = Math.floor(audio.duration);
          if (durTimeSpan) durTimeSpan.textContent = formatTime(Math.floor(audio.duration));
        }
      });
    }

    function seekAudio(val) { 
      if (isYt && ytPlayer) ytPlayer.seekTo(val, true);
      else if (audio) audio.currentTime = val; 
    }
    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return (m < 10 ? '0' + m : m) + ':' + (sec < 10 ? '0' + sec : sec);
    }

    // Cosmic Particles
    const canvas = document.getElementById('snow-canvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      let w = (canvas.width = window.innerWidth);
      let h = (canvas.height = window.innerHeight);
      window.addEventListener('resize', () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; });
      const shapes = ['dot', 'cross', 'streak'];
      const particles = Array.from({ length: 60 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        shape: shapes[Math.floor(Math.random() * shapes.length)],
        size: Math.random() * 2.5 + 1,
        speedX: (Math.random() - 0.5) * 0.4,
        speedY: (Math.random() - 0.5) * 0.35,
        opacity: Math.random() * 0.6 + 0.25,
        twinkleSpeed: Math.random() * 0.04 + 0.01,
        angle: Math.random() * Math.PI * 2
      }));
      function drawParticles() {
        ctx.clearRect(0, 0, w, h);
        for (let p of particles) {
          p.angle += p.twinkleSpeed;
          p.x += p.speedX;
          p.y += p.speedY;

          const currentOpacity = Math.max(0.1, Math.min(1, p.opacity + Math.sin(p.angle) * 0.35));

          ctx.save();
          ctx.fillStyle = 'rgba(255, 255, 255, ' + currentOpacity + ')';
          ctx.strokeStyle = 'rgba(255, 255, 255, ' + currentOpacity + ')';
          ctx.shadowBlur = 6;
          ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';

          if (p.shape === 'cross') {
            const arm = p.size * 1.6;
            ctx.beginPath();
            ctx.moveTo(p.x - arm, p.y);
            ctx.lineTo(p.x + arm, p.y);
            ctx.moveTo(p.x, p.y - arm);
            ctx.lineTo(p.x, p.y + arm);
            ctx.lineWidth = 1;
            ctx.stroke();
          } else if (p.shape === 'streak') {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.size * 2, p.y + p.size * 0.8);
            ctx.lineWidth = 0.8;
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * 0.75, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();

          if (p.y > h + 10) { p.y = -10; p.x = Math.random() * w; }
          else if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
          if (p.x > w + 10) { p.x = -10; p.y = Math.random() * h; }
          else if (p.x < -10) { p.x = w + 10; p.y = Math.random() * h; }
        }
        requestAnimationFrame(drawParticles);
      }
      drawParticles();
    }
  </script>
</body>
